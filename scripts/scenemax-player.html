<!doctype html>
<html lang="en"><meta charset="utf-8"><title>SceneMax rehearsal player</title>
<style>
*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#171816;color:#fff;font:18px system-ui}#game{display:block}#loading{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:12px;text-align:center;padding:20px}[hidden]{display:none!important}#error{color:#ffc8ae}
</style>
<canvas id="game" tabindex="-1"></canvas>
<div id="loading"><strong>SceneMax player</strong><div id="status" data-label="Loading scene">Preparing WebGPU…</div><progress id="progress"></progress><div id="error" role="alert"></div></div>
<div id="effect-status" hidden></div><script type="module">
const report = (status) => parent.postMessage({ type: "stagecue-player", status }, location.origin);
// The SMX scene emits this broadcast after its handlers are installed and the room is ready.
// Observe the outgoing SceneMax packet in this iframe only, then restore the transport.
const send = WebSocket.prototype.send;
WebSocket.prototype.send = function(data) {
  const result = send.call(this, data);
  const bytes = ArrayBuffer.isView(data) ? new Uint8Array(data.buffer, data.byteOffset, data.byteLength)
    : data instanceof ArrayBuffer ? new Uint8Array(data) : null;
  if (bytes && bytes[5] === 24 && new TextDecoder().decode(bytes.subarray(10)) === "studio_player_ready") {
    WebSocket.prototype.send = send;
    report("ready");
  }
  return result;
};
const error = document.getElementById("error");
new MutationObserver(() => { if (error.textContent) report("error"); }).observe(error,{childList:true,subtree:true});
try { await import(location.search === "?external" ? "./external-player.mjs" : "./game.js"); }
catch (cause) { document.getElementById("loading").hidden=false; error.textContent = String(cause); }
</script></html>
